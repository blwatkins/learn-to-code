# Minima theme configuration
remote_theme: jekyll/minima
plugins:
  - jekyll-remote-theme
  - jekyll-toc

# valid social icon names can be found at https://fontawesome.com/search?ic=brands

minima:
  skin: auto
  hide_site_feed_link: true
  show_excerpts: false
  social_links:
    - title: "Source Code"
      icon: git-alt
      url: "https://github.com/blwatkins/learn-to-code"
    - title: "GitHub Pages"
      icon: square-github
      url: "https://blwatkins.github.io/"
    - title: GitHub
      icon: github
      url: "https://github.com/blwatkins"
    - title: YouTube
      icon: youtube
      url: "https://www.youtube.com/channel/UCeJ-huUU2AWP0z4-HWr1BXQ"
    - title: LinkedIn
      icon: linkedin
      url: "https://www.linkedin.com/in/brittni-watkins/"
  nav_pages:
    - index.md

title: "Learn to Code, with Brittni Watkins"
description: "Notes, guides, resources, and references for learning software development and creative coding."
show_downloads: true

sass:
  quiet_deps: true

exclude:
  - .ruby-version
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .github
